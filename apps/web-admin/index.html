    <meta name="color-scheme" content="light dark" />

      try {
        var t = localStorage.getItem('edzy_admin_theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'dark');
